
server {
    listen 8443 ssl;
    server_name localhost;
    root /opt/nginx/html;

    # SSL configuration
    ssl_certificate /opt/nginx/ssl/server.crt;
    ssl_certificate_key /opt/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    location /api/voice/ {
        auth_request /auth;
        # auth_request_set $authorization $upstream_http_authorization;
        # proxy_set_header  authorization $authorization;
        auth_request_set $subject $upstream_http_subject;
        proxy_set_header X-Subject $subject;
        proxy_pass http://voiceapp:8084/voice/;
        proxy_pass_request_headers on;
    }


    location = /auth {
        internal;
        proxy_pass http://verifytoken:8085/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }



    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        # Additional directives for handling static files
        # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        #     expires max;
        #     add_header Cache-Control "public, max-age=31536000";
        # }
    }
    

}
    
