version: '3.8'

services:
  voiceapp:
    build:
      context: ./backend/voice-app
    ports:
      - "8084:8084"
    environment:
      - api_key=${api_key}

  verifytoken:
    build:
      context: ./backend/auth
    ports:
      - "8085:8085"
    environment:
      - auth_key_path=${auth_key_path}
    volumes:
      - '${auth_key_path}:/app/service-account.json'

  nginx:
    build:
      context: ./frontend
    ports:
      - "8081:8080"
    depends_on:
      - voiceapp


